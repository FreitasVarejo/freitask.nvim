# GERADO por scripts/gerar-cargo-aceite.sh a cada `make congelar`. Não edite.
[package]
name = "aceite"
description = "Testes de aceitação congelados do freitask (spec §3.3 e §4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false
autobins = false
autoexamples = false
autobenches = false

[lib]
path = "lib.rs"

[dependencies]

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
jsonschema = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
gerador = { workspace = true }

[lints.clippy]
unwrap_used = "allow"
expect_used = "allow"

[[test]]
name = "f0-fundacao"
path = "f0-fundacao/main.rs"

[[test]]
name = "f1-core"
path = "f1-core/main.rs"

[[test]]
name = "f2-leitura"
path = "f2-leitura/main.rs"

[[test]]
name = "f3-escrita"
path = "f3-escrita/main.rs"

[[test]]
name = "f4-deslocamentos"
path = "f4-deslocamentos/main.rs"

[[test]]
name = "f5-projeto-e-doctor"
path = "f5-projeto-e-doctor/main.rs"

[[test]]
name = "f6-acabamento-da-cli"
path = "f6-acabamento-da-cli/main.rs"

[[test]]
name = "f9a-dependencias-cli"
path = "f9a-dependencias-cli/main.rs"
