# cargo-mutants (spec §3.6). Limiar: zero `missed` em crates/core; catraca no
# resto (tests/aceite/mutantes.baseline, conferida por scripts/mutantes.sh).
#
# Exclusões, cada uma com o porquê:
# - crates/freitask/src/main.rs: é o despacho `main()` e a detecção de terminal;
#   um mutante ali só se mata abrindo um terminal de verdade, e o smoke em PTY
#   (§3.5, item 4) já prova o caminho que importa (sobe, desenha, `q` sai 0).
# - tests/**: código de teste, gerador e harness não são produção.
# O laço do terminal (crates/freitask/src/tui/laco.rs) é mutado: os testes o
# matam (decisão 67 em docs/decisoes-da-reescrita.md).
exclude_globs = [
  "crates/freitask/src/main.rs",
  "tests/**",
]

# Só as crates de produção entram; o workspace inteiro é testado contra cada
# mutante (`--workspace` nos testes), mas só estes três pacotes são mutados.
examine_globs = ["crates/**"]

# O que mata o mutante: os testes destes pacotes, inclusive os de aceitação
# congelados. O diferencial e o gerador não entram: o diferencial depende de
# nvim e leva minutos por rodada; o gerador não testa produção.
test_package = ["freitask-core", "freitask-vault", "freitask", "aceite"]

timeout_multiplier = 3.0
minimum_test_timeout = 60.0
